stages:
  prepare:
    cmd: python src/prepare_data.py
    deps:
      - src/prepare_data.py
      - data/raw/cars.csv
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - params.yaml:
        - train.alpha
        - train.random_seed
    outs:
      - models/model.pkl
      - models/run_id.txt:
          cache: false
  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/model.pkl
      - models/run_id.txt
      - data/processed/test.csv
    metrics:
      - metrics.json:
          cache: false