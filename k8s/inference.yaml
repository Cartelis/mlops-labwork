
apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-price-api
  namespace: mlops-labwork
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: car-price-api
  template:
    metadata:
      labels:
        app: car-price-api
    spec:
      containers:
        - name: car-price-api
          image: mlops-labwork-api:54a14ab7-v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-server.mlops-labwork.svc:5000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: car-price-api
  namespace: mlops-labwork
spec:
  selector:
    app: car-price-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP