apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-postgres
  namespace: mlops-labwork
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-postgres
  template:
    metadata:
      labels:
        app: mlflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: mlflowdb
            - name: POSTGRES_USER
              value: mlflowuser
            - name: POSTGRES_PASSWORD
              value: mlflowpassword
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-postgres
  namespace: mlops-labwork
spec:
  ports:
    - port: 5432
  selector:
    app: mlflow-postgres
